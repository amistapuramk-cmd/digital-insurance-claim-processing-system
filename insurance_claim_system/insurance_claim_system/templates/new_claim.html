{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:560px;margin:auto"><h2>File a Claim</h2>
<form method="post" enctype="multipart/form-data">
<label>Policy</label>
<select name="policy_id" required>
{% for p in policies %}<option value="{{ p.id }}">{{ p.policy_number }} – {{ p.policy_type }} (cover {{ "{:,.0f}".format(p.coverage_amount) }})</option>{% endfor %}
</select>
<label>Incident date</label><input type="date" name="incident_date" required>
<label>Claim amount</label><input type="number" step="0.01" min="1" name="claim_amount" required>
<label>Description</label><textarea name="description" rows="4" required></textarea>
<label>Supporting document (PDF/PNG/JPG, optional)</label><input type="file" name="document">
<button class="btn">Submit Claim</button>
</form></div>{% endblock %}
